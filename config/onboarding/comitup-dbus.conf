<!DOCTYPE busconfig PUBLIC
          "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
          "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="com.github.davesteele.comitup"/>
    <allow send_destination="com.github.davesteele.comitup"/>
  </policy>

  <policy user="messagebox-onboarding">
    <allow send_destination="com.github.davesteele.comitup"
           send_interface="com.github.davesteele.comitup"
           send_member="access_points"/>
    <allow send_destination="com.github.davesteele.comitup"
           send_interface="com.github.davesteele.comitup"
           send_member="state"/>
    <allow send_destination="com.github.davesteele.comitup"
           send_interface="com.github.davesteele.comitup"
           send_member="connect"/>
    <allow send_destination="com.github.davesteele.comitup"
           send_interface="com.github.davesteele.comitup"
           send_member="delete_connection"/>
  </policy>

  <policy context="default">
    <deny send_destination="com.github.davesteele.comitup"/>
  </policy>
</busconfig>
