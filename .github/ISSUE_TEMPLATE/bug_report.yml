name: Bug report
description: Report a reproducible, non-sensitive defect
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Do not include phone numbers, JIDs, Wi-Fi details, NFC identifiers, recordings, authentication data, or private addresses.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior using synthetic data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed secrets, personal data, recordings, device state, and private URLs.
          required: true
