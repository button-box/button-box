name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [wacli, cloud]
    env:
      MSGBOX_TEST_TRANSPORT: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: make check

  # Branch protection on main requires a status named "test"; it passes only when both modes pass.
  test:
    needs: check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: test "${{ needs.check.result }}" = success
