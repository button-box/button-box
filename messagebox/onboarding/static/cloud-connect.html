<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Connect your box to WhatsApp | Button Box</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/cloud-connect.js" defer></script>
</head>
<body>
  <main class="shell single-page">
    <section class="card" aria-labelledby="cloud-title">
      <p class="eyebrow">Button Box Cloud</p>
      <h1 id="cloud-title">Welcome!</h1>
      <p>Connect your WhatsApp account to manage your box and invite your family.</p>
      <button id="cloud-start" type="button">Connect WhatsApp</button>
      <div id="cloud-claim" hidden>
        <p><a id="cloud-link" class="button" href="/cloud-connect" target="_blank" rel="noopener noreferrer">Open WhatsApp</a></p>
        <details>
          <summary>Using another phone?</summary>
          <p><img id="cloud-qr" alt="Scan to connect in WhatsApp" width="260" height="260"></p>
          <button id="cloud-copy" class="secondary" type="button">Copy link</button>
        </details>
        <p id="cloud-expiry"></p>
      </div>
      <button id="cloud-cancel" class="secondary" type="button" hidden>Cancel connection</button>
      <p id="cloud-status" role="status" aria-live="polite">Checking connection status…</p>
      <button id="cloud-complete" type="button" hidden>Finish box setup</button>
      <details class="settings-detail">
        <summary>Change Wi-Fi</summary>
        <p>This disconnects the box from this Wi-Fi. Join its setup hotspot to choose another network.</p>
        <form action="/wifi/change" method="post">
          <button class="secondary" type="submit">Use setup hotspot</button>
        </form>
      </details>
    </section>
  </main>
</body>
</html>
