[Unit]
ConditionPathExists=/etc/messagebox-onboarding/enabled
BindsTo=comitup.service
PartOf=comitup.service
Requires=messagebox-whatsapp-pairing.service
After=comitup.service messagebox-whatsapp-pairing.service

[Service]
ExecStartPre=-+/usr/sbin/nft delete table inet messagebox_onboarding
ExecStartPre=+/usr/sbin/nft -f /etc/messagebox-onboarding/firewall.nft
ExecStart=
ExecStart=/usr/bin/gunicorn --workers 1 --worker-class sync --bind 10.41.0.1:80 --error-logfile - onboarding.app:app
ExecStopPost=-+/usr/sbin/nft delete table inet messagebox_onboarding
User=messagebox-onboarding
Group=messagebox-onboarding
WorkingDirectory=/opt/messagebox
Environment=HOME=/var/lib/messagebox-onboarding
Environment=MSGBOX_ONBOARDING_MODE=HOTSPOT
UMask=0077
AmbientCapabilities=CAP_NET_BIND_SERVICE
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
NoNewPrivileges=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectSystem=strict
ProtectHome=yes
ReadOnlyPaths=/etc/messagebox-onboarding
ReadWritePaths=/var/lib/messagebox-onboarding
LimitCORE=0
